<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MTile</title>
    <base href="./" />
    <style>
        html, body { margin: 0; padding: 0; background: #111; }
        #blazor-error-ui {
            background: #b80000; color: white; padding: 1rem;
            display: none; position: fixed; bottom: 0; left: 0; right: 0;
        }
    </style>
</head>

<body>

    <div id="app">
        <div id="loading" style="display: table-cell; margin: auto; width:100vw; height:100vh; vertical-align: middle; background: #111; color:#eee;">
            <div style="display: block; margin: auto; width: 9em; font-family: system-ui, sans-serif;">
                <div style="text-align: center; font-size: 0.85em;">Made with <a href="https://github.com/kniEngine/kni" style="color:#9cf;">KNI</a></div>
                <div style="text-align: center; font-size: 1.8em;">loading&nbsp;<marquee style="width:0.9em; vertical-align: bottom;">.&nbsp;.&nbsp;.&nbsp;&nbsp;&nbsp;</marquee></div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">&times;</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>

    <!-- KNI WASM JS shims. Versions follow the nkast.Wasm.* package versions and
         should be kept in sync if the KNI package set is upgraded. -->
    <script src="_content/nkast.Wasm.Dom/js/JSObject.8.0.5.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Window.8.0.5.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Document.8.0.5.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Navigator.8.0.5.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Gamepad.8.0.5.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Media.8.0.5.js"></script>
    <script src="_content/nkast.Wasm.XHR/js/XHR.8.0.5.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/Canvas.8.0.5.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/CanvasGLContext.8.0.5.js"></script>
    <script src="_content/nkast.Wasm.Audio/js/Audio.8.0.5.js"></script>
    <script src="_content/nkast.Wasm.XR/js/XR.8.0.5.js"></script>

    <!-- WebRTC transport for browser-vs-browser PvP (window.mtileRtc). -->
    <script src="mtileRtc.js"></script>

    <!-- Firestore room-code signaling (window.mtileSignal); config in firebase-config.js. -->
    <script src="signaling.js"></script>

    <script>
        // TickDotNet returns false (or throws) when the game loop has stopped — either an
        // unhandled exception surfaced into the lobby's Failed screen, or the page is done.
        // Either way, stop re-queueing so we don't spin an rAF loop against a dead game.
        // "Sharp rendering": back the canvas with physical pixels instead of CSS pixels, so
        // a high-DPI screen is not shown a stretched frame. The canvas keeps its CSS size
        // (set in initRenderJS); only its backing store grows. Re-checked every frame
        // because KNI resets the canvas to window.innerWidth/Height on each resize. Capped
        // at 2x: a 3x phone would quadruple-plus the fill cost for little visible gain.
        // The game is told the CSS size and the scale so it can keep framing, HUD size and
        // mouse mapping unchanged (Game1.SyncHighDpi).
        function tickJS() {
            var alive = false;
            try {
                var w = window.innerWidth, h = window.innerHeight, scale = 1;
                if (window.mtileSharp) {
                    scale = Math.min(window.devicePixelRatio || 1, 2);
                    var canvas = document.getElementById('theCanvas');
                    var pw = Math.round(w * scale), ph = Math.round(h * scale);
                    if (canvas.width !== pw || canvas.height !== ph) {
                        canvas.width = pw;
                        canvas.height = ph;
                    }
                }
                alive = window.theInstance.invokeMethod('TickDotNet', w, h, scale);
            } catch (e) {
                console.error('MTile: game loop stopped', e);
                alive = false;
            }
            if (alive) window.requestAnimationFrame(tickJS);
        }

        // Clipboard helper for the lobby's "copy" buttons. Kept out of mtileRtc.js so that
        // module stays DOM-free and reusable by a signaling server.
        window.mtileCopy = (text) => {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).catch(e => console.warn('copy failed', e));
                return;
            }
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); } catch (e) { console.warn('copy failed', e); }
            document.body.removeChild(ta);
        };

        // Lobby setting, remembered per browser. Absent = on.
        window.mtileGetSharp = () => {
            try { return localStorage.getItem('mtileSharp') !== '0'; } catch (e) { return true; }
        };
        window.mtileSetSharp = (on) => {
            try { localStorage.setItem('mtileSharp', on ? '1' : '0'); } catch (e) { }
        };

        window.initRenderJS = (instance, sharp) => {
            window.theInstance = instance;
            window.mtileSharp = !!sharp;

            var canvas = document.getElementById('theCanvas');
            var holder = document.getElementById('canvasHolder');
            canvas.width = holder.clientWidth;
            canvas.height = holder.clientHeight;
            if (window.mtileSharp) {
                // Pin the displayed size: the backing store is about to outgrow it.
                canvas.style.width = '100vw';
                canvas.style.height = '100vh';
                canvas.style.display = 'block';
            }
            canvas.addEventListener("contextmenu", e => e.preventDefault());

            window.requestAnimationFrame(tickJS);
        };

        // Prevent arrow keys / space / wheel from scrolling the outer page
        // when the game is embedded in an iframe (e.g. itch.io).
        window.addEventListener("keydown", function (event) {
            if ([32, 37, 38, 39, 40].indexOf(event.keyCode) > -1)
                event.preventDefault();
        });
        window.addEventListener("wheel", function (event) {
            event.preventDefault();
        }, { passive: false });
    </script>
</body>

</html>
